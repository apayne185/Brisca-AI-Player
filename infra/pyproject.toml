[project]
name = "brisca-infra"
version = "0.1.0"
description = "AWS CDK app deploying the Brisca AI service to ECS Fargate."
requires-python = ">=3.11"
dependencies = [
    "aws-cdk-lib>=2.170",
    "constructs>=10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers"]
