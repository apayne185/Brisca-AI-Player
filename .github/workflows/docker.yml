name: Docker

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/brisca-ai

jobs:
  image:
    name: Build and smoke-test image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: brisca-ai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the running container
        run: |
          docker run -d --name api -p 8000:8000 brisca-ai:ci
          for _ in $(seq 1 60); do curl -sf localhost:8000/ready && break; sleep 1; done
          curl -sf localhost:8000/ready | grep -q '"bot_detector":true'
          curl -sf -X POST localhost:8000/v1/games \
            -H 'content-type: application/json' -d '{"agent":"ppo","seed":1}' | grep -q '"your_turn":true'
          test "$(docker inspect --format '{{.Config.User}}' api)" = brisca

      - name: Show container logs
        if: failure()
        run: docker logs api

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
