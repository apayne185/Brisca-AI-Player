name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_LOCKED: "1"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run mypy

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-extras
      - run: uv run pytest --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v7
        if: matrix.python-version == '3.12'
        with:
          name: coverage
          path: coverage.xml

  strength:
    name: Agent strength
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run pytest -m slow -n auto

  streaming:
    name: Streaming integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Start Redpanda
        run: |
          docker run -d --name redpanda -p 19092:19092 redpandadata/redpanda:v24.3.1 \
            redpanda start --mode=dev-container --smp=1 \
            --kafka-addr=0.0.0.0:19092 --advertise-kafka-addr=localhost:19092
          for _ in $(seq 1 60); do
            docker exec redpanda rpk cluster health | grep -qE 'Healthy:.+true' && exit 0
            sleep 2
          done
          exit 1
      - run: uv sync --all-extras
      - name: Round trip through a real broker
        run: uv run pytest tests/detection/test_streaming.py -k real_broker -rs
        env:
          BRISCA_KAFKA_BOOTSTRAP: localhost:19092

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - name: Smoke-test the wheel in a clean environment
        run: uv run --isolated --no-project --with dist/*.whl python -c "import brisca; print(brisca.__version__)"

  # Single stable check name for branch protection, independent of the matrix.
  ci-success:
    name: CI success
    if: always()
    needs: [lint, typecheck, test, strength, streaming, build]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
